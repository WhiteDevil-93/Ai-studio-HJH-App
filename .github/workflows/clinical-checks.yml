name: Clinical checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The check pipeline regenerates clinical corrections; committed files
      # must be byte-identical to the regenerated output or the release is
      # shipping data that was never reviewed.
      - name: Fail on uncommitted generated changes
        run: git diff --exit-code
