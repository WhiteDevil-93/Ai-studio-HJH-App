<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Asclepius ICU & ED Clinical Guidelines, Resuscitation Flowcharts, Drug Infusion Calculators & Hospital SOPs" />
    
    <!-- PWA Web App Manifest & Icons -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="alternate icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    
    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Asclepius" />
    
    <title>Asclepius — ICU & ED Clinical Reference</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = new URL('sw.js', window.location.href).pathname;
          navigator.serviceWorker.register(swUrl, { scope: './' })
            .then((registration) => {
              console.log('Asclepius PWA Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('Asclepius PWA Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
